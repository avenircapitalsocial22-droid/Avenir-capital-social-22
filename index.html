<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avenir Capital</title>
<style>
:root{--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632;--wa:#10b981;--er:#ef4444;--gold:#f59e0b;--red:#dc2626;--jeko:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:100vh;}
#app{max-width:480px;margin:auto;padding:16px;min-height:100vh;}
h1,h2,h3{margin:0 0 12px}h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--red),var(--pr));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.hero small{opacity:.85;font-size:13px}.hero b{display:block;font-size:32px;margin-top:4px}
.banner-pret{background:linear-gradient(135deg, var(--gold) 0%, #d97706 100%);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.25);text-decoration:none;display:block}
.banner-pret:active{transform:scale(0.98)}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:600;text-decoration:none;display:inline-block;text-align:center;transition:background 0.2s}
.btn:hover{background:var(--pr2)}
.btn.sec{background:rgba(16,185,129,0.15);color:var(--pr)}.btn.out{background:none;border:1px solid var(--er);color:var(--er)}
.btn.jeko{background:var(--jeko);color:#fff}
.btn.gold{background:linear-gradient(135deg, var(--gold), #d97706);color:#fff;box-shadow:0 4px 10px rgba(245,158,11,0.3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid button{padding:16px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);text-align:left}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(245, 158, 11, 0.2);color:var(--gold);font-weight:600}
.tag.pr{background:rgba(16, 185, 129, 0.2);color:var(--pr)}
.mu{color:var(--mu);font-size:14px}.err{color:var(--er);font-size:14px;min-height:20px;margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.back{background:none;border:0;color:var(--pr);padding:0 0 12px;font-weight:600;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
nav button{flex:1;padding:10px 2px;border:0;background:none;color:var(--mu);font-size:11px}nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px;margin-bottom:2px}
.num{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.vip-tag{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(16,185,129,0.2);color:var(--pr);font-weight:600}
.vip-icon{font-size:20px;margin-right:6px}
.manual-step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.manual-num{background:var(--pr);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
// 📌 CONSTANTES & PARAMÈTRES
const WAVE_NUM = "0509302107";
const MOOV_NUM = "0104217547";
const MTN_NUM  = "0545576710";
const JEKO_LINK = "https://pay.jeko.africa/pl/4f580acc-5df9-440e-b168-6beb65823bea"; 
const SUPPORT  = "https://wa.me/message/ABZ2BRFJPVIOE1";
const BONUS_PREMIUM = 350000;
const INVITATION_CODE = "https://avenircapitalsocial22-droid.github.io/Avenir-capital-social-22/";

// 📊 9 PLANS D'INVESTISSEMENT (VIP1 À VIP9)
const VIP=[
  {n:"VIP1 — Découverte", icon:"🟢", p:5000, jourRevenu:500, benefice:3500, total:8500, duree:7},
  {n:"VIP2 — Essentiel", icon:"🟡", p:10000, jourRevenu:1000, benefice:15000, total:25000, duree:15},
  {n:"VIP3 — Croissance", icon:"🔵", p:50000, jourRevenu:1130, benefice:22600, total:72600, duree:20},
  {n:"VIP4 — Premium", icon:"🟣", p:100000, jourRevenu:2000, benefice:60000, total:160000, duree:30},
  {n:"VIP5 — Excellence", icon:"🟠", p:200000, jourRevenu:3000, benefice:250000, total:450000, duree:45},
  {n:"VIP6 — Prestige", icon:"🟤", p:500000, jourRevenu:2250, benefice:135000, total:635000, duree:60},
  {n:"VIP7 — Élite", icon:"🔴", p:1000000, jourRevenu:5000, benefice:450000, total:1450000, duree:90},
  {n:"VIP8 — Mini", icon:"⚡", p:4000, jourRevenu:343, benefice:4116, total:8116, duree:12},
  {n:"VIP9 — Starter", icon:"🚀", p:3500, jourRevenu:250, benefice:5750, total:9250, duree:23}
];

let P = "signup", T = {};

// GESTION DU STOCKAGE LOCAL (LocalStorage)
function getStorage(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let currentUser = getStorage("ac_user", null);
let recs = getStorage("ac_recs", []);
let rets = getStorage("ac_rets", []);
let buys = getStorage("ac_buys", []);
let teamN = getStorage("ac_team", 0);

// 🕒 VÉRIFICATION DE LA RÉCLAMATION QUOTIDIENNE
function canClaimToday() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const lastClaim = getStorage("ac_last_claim", "");
  return lastClaim !== todayStr && buys.some(b => (b.joursRestants === undefined ? b.duree : b.joursRestants) > 0);
}

// 🎁 FONCTION DE RÉCLAMATION MANUELLE DES REVENUS
window.claimDailyRevenues = function() {
  if (!currentUser) return;
  const todayStr = new Date().toISOString().slice(0, 10);
  const lastClaim = getStorage("ac_last_claim", "");

  if (lastClaim === todayStr) {
    alert("⚠️ Vous avez déjà réclamé vos revenus aujourd'hui. Revenez demain matin !");
    return;
  }

  if (buys.length === 0) {
    alert("❌ Vous n'avez aucun investissement actif pour réclamer des revenus.");
    return;
  }

  let addedTotal = 0;
  let activeCount = 0;

  buys.forEach(b => {
    if (b.joursRestants === undefined) b.joursRestants = b.duree;
    
    if (b.joursRestants > 0) {
      currentUser.bal += b.jourRevenu;
      addedTotal += b.jourRevenu;
      b.joursRestants--;
      if (b.joursRestants === 0) b.status = "Terminé";
      activeCount++;
    }
  });

  if (addedTotal > 0) {
    setStorage("ac_user", currentUser);
    setStorage("ac_buys", buys);
    setStorage("ac_last_claim", todayStr);
    
    alert(`🎉 Félicitations !\n+${F(addedTotal)} ont été ajoutés à votre solde pour vos ${activeCount} investissement(s) actif(s).`);
    render();
  } else {
    alert("⚠️ Tous vos investissements sont arrivés à terme.");
  }
};

const U = () => currentUser || { name: "Investisseur", phone: "", bal: 0, ref: INVITATION_CODE, card: null };
const F = n => Number(n||0).toLocaleString("fr-FR") + " F";
const D = () => new Date().toLocaleDateString("fr-FR");
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id)?.value?.trim() || "";

function go(p, t){ P = p; if(t) Object.assign(T, t); render(); scrollTo(0,0); }
function err(m){ const e = document.getElementById("err"); if(e) e.textContent = m; }

const back = (p="home") => `<button class="back" onclick="go('${p}')">‹ Retour</button>`;
const hist = (a, empty) => a.length ? a.map(x => `<div class="card row"><div><b>${F(x.a)}</b><div class="mu">${x.m} · ${x.t}</div></div><span class="tag">${x.s||"En attente"}</span></div>`).join("") : `<p class="mu">${empty}</p>`;

window.copyN = function(num){
  navigator.clipboard.writeText(num).then(() => alert("✅ Numéro copié !")).catch(() => alert(num));
};

const pages = {
signup: () => `<h1>Avenir Capital</h1><p class="mu">Créez votre compte pour commencer à investir.</p>
<div class="card">
  <label>Nom complet</label><input id="n" placeholder="Ex: Jean Kouassi">
  <label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">
  <label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">
  <label>Code d'invitation</label><input id="rf" value="${INVITATION_CODE}">
  <div id="err" class="err"></div>
  <button class="btn" onclick="signup()">S'inscrire</button>
</div>
<button class="btn sec" onclick="go('login')">J'ai déjà un compte</button>`,

login: () => `<h1>Avenir Capital</h1>
<div class="card">
  <label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">
  <label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">
  <div id="err" class="err"></div>
  <button class="btn" onclick="login()">Se connecter</button>
</div>
<button class="btn sec" onclick="go('signup')">Créer un compte</button>`,

home: () => { 
  const u = U(); 
  const showClaimBtn = canClaimToday();
  return `
<h2>Bonjour ${esc(u.name)} 👋</h2>
<div class="hero">
  <small>Solde disponible</small>
  <b>${F(u.bal)}</b>
</div>

${showClaimBtn ? `
<button class="btn gold" style="margin-bottom:14px;font-size:16px;padding:15px;" onclick="claimDailyRevenues()">
  🎁 Réclamer mes revenus du jour
</button>` : `
<div class="card" style="text-align:center;background:rgba(16,185,129,0.05);border-color:var(--pr);margin-bottom:14px;">
  <p style="margin:0;color:var(--pr);font-size:14px">✅ Revenus du jour déjà réclamés ou aucun plan actif.</p>
</div>`}

<a class="banner-pret" href="${SUPPORT}" target="_blank" rel="noopener">
  <span style="font-size:28px">💰</span>
  <h3 style="margin:6px 0 2px">Obtenir un Prêt Rapide</h3>
  <p style="margin:0;opacity:0.9;font-size:13px">Jusqu'à ${F(BONUS_PREMIUM)} — Écrivez-nous sur WhatsApp</p>
</a>

<div class="grid">
  <button onclick="go('recharge')"><span>➕</span>Recharger</button>
  <button onclick="go('withdraw')"><span>💸</span>Retirer</button>
  <button onclick="go('invest')"><span>📈</span>Investir</button>
  <button onclick="go('manual')"><span>📖</span>Guide / Manuel</button>
</div>

<button class="li" onclick="go('histRec')">📊 Historique des recharges <span>›</span></button>
<button class="li" onclick="go('histRet')">📊 Historique des retraits <span>›</span></button>
<button class="li" onclick="go('service')">💬 Service client WhatsApp <span>›</span></button>`; 
},

invest: () => `<h2>📈 Plans d'investissement (${VIP.length} Sacs)</h2>` + VIP.map((v,i) => `
<div class="card">
  <div class="row"><b><span class="vip-icon">${v.icon}</span>${v.n}</b><span class="vip-tag">${v.duree} jours</span></div>
  <p class="mu" style="margin:8px 0">
    💵 Capital : <b>${F(v.p)}</b><br>
    📅 Durée : ${v.duree} jours<br>
    ✅ Revenu/jour : ${F(v.jourRevenu)}<br>
    🎯 Bénéfice total : +${F(v.benefice)}<br>
    💰 Gain total estimé : <b>${F(v.total)}</b>
  </p>
  <button class="btn" onclick="buy(${i})">Investir maintenant</button>
</div>`).join("") + `<div id="err" class="err"></div>`,

achats: () => {
  const showClaimBtn = canClaimToday();
  return `<h2>Mes achats</h2>` + 
  (showClaimBtn ? `<button class="btn gold" style="margin-bottom:12px" onclick="claimDailyRevenues()">🎁 Réclamer mes revenus du jour</button>` : ``) +
  (buys.length ? buys.map(x => `
<div class="card">
  <div class="row"><b>${x.icon||'📊'} ${x.n}</b><span class="tag ${x.joursRestants === 0 ? '' : 'pr'}">${x.joursRestants === 0 ? 'Terminé' : 'Actif'}</span></div>
  <div class="mu" style="margin-top:6px">
    Investi : ${F(x.p)} · +${F(x.jourRevenu)}/jour<br>
    Jours restants : <b>${x.joursRestants !== undefined ? x.joursRestants : x.duree}</b> / ${x.duree} jours<br>
    Bénéfice total : +${F(x.benefice)} · Total : ${F(x.total)}<br>
    Acheté le ${x.t}
  </div>
</div>`).join("") : `<p class="mu">Aucun achat d'investissement pour le moment.</p>`);
},

team: () => `<h2>Mon équipe</h2><div class="card"><p class="mu">Votre lien / code d'invitation</p><div class="num" style="font-size:14px;word-break:break-all">${INVITATION_CODE}</div><p class="mu" style="margin-top:10px">Membres invités : <b>${teamN}</b></p></div>`,

account: () => { const u = U(); return `<h2>Mon compte</h2>
<div class="card"><b>${esc(u.name)}</b><div class="mu">${esc(u.phone)} · Solde : ${F(u.bal)}</div></div>
${[["histRec","Historique des recharges"],["histRet","Historique des retraits"],["achats","Mes achats"],["team","Équipe"],["manual","📖 Guide d'utilisation & Réclamation"],["link","Lier mon compte de retrait"],["card","Ma carte bancaire"],["service","Service client"]].map(x => `<button class="li" onclick="go('${x[0]}')">${x[1]} <span>›</span></button>`).join("")}
<button class="btn out" onclick="logout()">Se déconnecter</button>`; },

manual: () => `${back()}<h2>📖 Manuel d'utilisation & Réclamation</h2>
<div class="card">
  <h3 style="color:var(--pr);margin-bottom:8px">1. Comment recharger son compte ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Allez sur l'accueil et cliquez sur le bouton <b>Recharger</b>.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Entrez le montant souhaité (minimum 1 000 F) ou choisissez un montant rapide.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Sélectionnez votre moyen de paiement (Wave, MTN Money, Moov Money ou Jeko).</div></div>
  <div class="manual-step"><div class="manual-num">4</div><div class="mu">Effectuez le transfert vers le numéro indiqué, puis entrez votre numéro d'expéditeur et la référence de transaction pour confirmer.</div></div>
</div>

<div class="card">
  <h3 style="color:var(--pr);margin-bottom:8px">2. Comment acheter un plan (Sac) ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Vérifiez que votre solde disponible est suffisant.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Cliquez sur l'onglet <b>Investir</b> en bas de l'écran.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Choisissez le plan VIP de votre choix (ex: VIP1 à 5 000 F) et cliquez sur <b>Investir maintenant</b>.</div></div>
</div>

<div class="card" style="border-color:var(--gold)">
  <h3 style="color:var(--gold);margin-bottom:8px">3. Comment réclamer ses revenus chaque matin ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Connectez-vous à votre application <b>chaque matin</b>.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Sur la page <b>Accueil</b> ou dans l'onglet <b>Mes achats</b>, un bouton doré clignotant apparaîtra : <b style="color:var(--gold)">"🎁 Réclamer mes revenus du jour"</b>.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Cliquez dessus pour ajouter instantanément vos gains journaliers de vos investissements actifs à votre solde disponible selon la durée de chaque plan !</div></div>
</div>`,

recharge: () => `${back()}<h2>Recharger</h2>
<div class="card">
  <label>Montant (minimum 1 000 F)</label>
  <input id="a" type="number" inputmode="numeric" value="${T.amt||""}" placeholder="Ex: 10000">
  <div class="chips">
    ${[4000, 5000, 10000, 50000, 100000].map(v => `<button onclick="document.getElementById('a').value=${v}">${v.toLocaleString("fr-FR")}</button>`).join("")}
  </div>
  <div id="err" class="err"></div>
  <button class="btn" onclick="toMethod()">Continuer</button>
</div>`,

method: () => `${back("recharge")}<h2>Choisir le mode de paiement</h2>
<p class="mu">Montant à recharger : <b>${F(T.amt)}</b></p>
<button class="li wave" onclick="go('pay', {m:'Wave', num:'${WAVE_NUM}'})"><b>Wave</b><span>›</span></button>
<button class="li" onclick="go('pay', {m:'MTN Money', num:'${MTN_NUM}'})"><b>MTN Money</b><span>›</span></button>
<button class="li" onclick="go('pay', {m:'Moov Money', num:'${MOOV_NUM}'})"><b>Moov Money</b><span>›</span></button>
<a class="btn jeko" style="display:block;margin-top:10px;text-align:center;text-decoration:none" href="${JEKO_LINK}" target="_blank">🔗 Veuillez payer pour Avenir avec Jeko</a>`,

pay: () => `${back("method")}<h2>Paiement par ${T.m}</h2>
<div class="card">
  <p class="mu">Veuillez effectuer le transfert de <b>${F(T.amt)}</b> vers le numéro ci-dessous :</p>
  <div class="card" style="background:var(--bg);text-align:center">
    <div class="row" style="align-items:center;justify-content:center;gap:12px;">
      <div class="num" style="margin:0">${T.num}</div>
    </div>
    <div class="row" style="align-items:center;justify-content:center;gap:8px;margin-top:10px;">
      <button class="btn sec btn-sm" style="width:auto;padding:8px 16px" onclick="copyN('${T.num}')">Copier le numéro</button>
      <a class="btn jeko" style="width:auto;padding:8px 14px;font-size:13px;text-decoration:none;" href="${JEKO_LINK}" target="_blank">🔗 Veuillez payer pour Avenir</a>
    </div>
  </div>
  <label>Votre numéro de paiement (expéditeur)</label><input id="pn" type="tel" placeholder="Ex: 0708091011">
  <label>ID de transaction / Référence</label><input id="tx" placeholder="Ex: Tx12345678">
  <div id="err" class="err"></div>
  <button class="btn" onclick="confirmPay()">Confirmer le paiement</button>
</div>`,

withdraw: () => { const c = U().card; return `${back()}<h2>Retirer des fonds</h2>
<div class="card">
  <p class="mu">Solde disponible : <b style="color:var(--pr)">${F(U().bal)}</b></p>
  <label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric" placeholder="Ex: 5000">
  <label>Votre numéro de réception</label><input id="pn" type="tel" value="${c ? esc(c.num) : ""}" placeholder="Ex: 0708091011">
  <div id="err" class="err"></div>
  <button class="btn" onclick="doWd()">Valider le retrait</button>
</div>`; },

histRec: () => `${back()}<h2>Historique des recharges</h2>` + hist(recs, "Aucune recharge enregistrée."),
histRet: () => `${back()}<h2>Historique des retraits</h2>` + hist(rets, "Aucun retrait enregistré."),

link: () => { const u = U(); return `${back("account")}<h2>Lier un compte de retrait</h2>
<div class="card">
  <label>Opérateur (Wave, Moov, MTN)</label>
  <select id="m">
    <option>Wave</option>
    <option>Moov Money</option>
    <option>MTN Money</option>
  </select>
  <label>Nom complet sur le compte</label>
  <input id="accName" value="${esc(u.name)}" placeholder="Ex: Jean Kouassi">
  <label>Numéro de téléphone</label>
  <input id="pn" type="tel" placeholder="Ex: 0708091011">
  <label>Code secret de retrait (6 chiffres)</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">
  <div id="err" class="err"></div>
  <button class="btn" onclick="doLink()">Enregistrer</button>
</div>`; },

card: () => { const c = U().card; return `${back("account")}<h2>Ma carte de retrait</h2>` + (c ? `
<div class="hero"><small>${esc(c.m)}</small><b>${esc(c.num)}</b><small>${esc(c.accName || U().name)}</small></div>` : `
<p class="mu">Aucun compte de retrait lié pour l'instant.</p><button class="btn" onclick="go('link')">Lier un compte</button>`); },

service: () => `${back("account")}<h2>Service client & Support</h2>
<div class="card">
  <p class="mu">Besoin d'aide ou de conseils ? Contactez-nous sur WhatsApp pour vos recharges, retraits ou demandes de prêt.</p>
  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="${SUPPORT}" target="_blank" rel="noopener">💬 Contact WhatsApp</a>
</div>`
};

function render(){
  const app = document.getElementById("app"), n = document.getElementById("nav");
  if(!currentUser && P !== "login") P = "signup";
  if(currentUser && (P === "signup" || P === "login")) P = "home";
  
  if(app && pages[P]) app.innerHTML = pages[P]();
  
  const tabs = [["home","🏠","Accueil"],["invest","📈","Investir"],["achats","🧾","Sacs"],["team","👥","Équipe"],["account","👤","Compte"]];
  if(n){
    n.style.display = (P === "signup" || P === "login") ? "none" : "flex";
    n.innerHTML = tabs.map(t => `<button class="${t[0]===P?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
  }
}

function signup(){
  const n = $("n"), p = $("ph"), w = $("pw"), r = $("rf") || INVITATION_CODE;
  if(!n || p.length < 8 || w.length < 6) return err("Veuillez remplir tous les champs (Mot de passe : min. 6 caractères).");
  
  currentUser = { name: n, phone: p, bal: 0, ref: r, card: null };
  setStorage("ac_user", currentUser);
  go("home");
}

function login(){
  const p = $("ph"), w = $("pw");
  if(!p || p.length < 8) return err("Entrez votre numéro et mot de passe.");
  
  currentUser = getStorage("ac_user", { name: "Investisseur", phone: p, bal: 0, ref: INVITATION_CODE, card: null });
  currentUser.phone = p;
  setStorage("ac_user", currentUser);
  go("home");
}

function logout(){
  currentUser = null;
  localStorage.removeItem("ac_user");
  go("signup");
}

function buy(i){
  const v = VIP[i];
  if(currentUser.bal < v.p) return err("Solde insuffisant. Rechargez votre compte.");
  
  currentUser.bal -= v.p;
  setStorage("ac_user", currentUser);
  
  buys.push({ 
    n: v.n, 
    icon: v.icon, 
    p: v.p, 
    jourRevenu: v.jourRevenu, 
    benefice: v.benefice, 
    total: v.total, 
    duree: v.duree, 
    joursRestants: v.duree, 
    t: D() 
  });
  setStorage("ac_buys", buys);
  go("achats");
}

function toMethod(){
  const a = +$("a");
  if(a < 1000) return err("Montant minimum : 1 000 F.");
  T.amt = a;
  go("method");
}

function confirmPay(){
  const p = $("pn"), t = $("tx");
  if(p.length < 8 || !t) return err("Veuillez remplir tous les champs de paiement.");
  
  recs.unshift({ a: T.amt, m: T.m, t: D(), s: "Validé" });
  setStorage("ac_recs", recs);
  
  currentUser.bal += T.amt;
  setStorage("ac_user", currentUser);
  
  alert("✅ Recharge validée avec succès !");
  go("home");
}

function doWd(){
  const a = +$("a"), p = $("pn");
  if(a < 1000) return err("Montant minimum de retrait : 1 000 F.");
  if(currentUser.bal < a) return err("Solde insuffisant pour ce retrait.");
  if(!p) return err("Entrez votre numéro de réception.");
  
  currentUser.bal -= a;
  setStorage("ac_user", currentUser);
  
  rets.unshift({ a: a, m: "Mobile Money (" + p + ")", t: D(), s: "En attente" });
  setStorage("ac_rets", rets);
  
  alert("💸 Demande de retrait enregistrée avec succès !");
  go("home");
}

function doLink(){
  const m = $("m"), acc = $("accName"), p = $("pn"), pin = $("pin");
  if(!acc || p.length < 8 || pin.length < 4) return err("Veuillez remplir tous les champs correctement.");
  
  currentUser.card = { m, accName: acc, num: p };
  setStorage("ac_user", currentUser);
  alert("✅ Compte de retrait lié avec succès !");
  go("account");
}

render();
</script>
</body>
</html>
