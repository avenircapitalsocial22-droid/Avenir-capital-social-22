<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avenir Capital</title>
<style>
:root{--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632;--wa:#10b981;--er:#ef4444;--gold:#f59e0b;--red:#dc2626;--jeko:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a12;--card:#132e21;--tx:#f8fafc;--mu:#a3b8af;--pr:#10b981;--pr2:#059669;--bd:#1e4632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:100vh;}
#app{max-width:480px;margin:auto;padding:16px;min-height:100vh;}
h1,h2,h3{margin:0 0 12px}h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--red),var(--pr));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.hero small{opacity:.85;font-size:13px}.hero b{display:block;font-size:32px;margin-top:4px}
.banner-pret{background:linear-gradient(135deg, var(--gold) 0%, #d97706 100%);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.25);text-decoration:none;display:block}
.banner-pret:active{transform:scale(0.98)}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:600;text-decoration:none;display:inline-block;text-align:center;transition:background 0.2s}
.btn:hover{background:var(--pr2)}
.btn.sec{background:rgba(16,185,129,0.15);color:var(--pr)}.btn.out{background:none;border:1px solid var(--er);color:var(--er)}
.btn.jeko{background:var(--jeko);color:#fff}
.btn.gold{background:linear-gradient(135deg, var(--gold), #d97706);color:#fff;box-shadow:0 4px 10px rgba(245,158,11,0.3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid button{padding:16px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);text-align:left}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(245, 158, 11, 0.2);color:var(--gold);font-weight:600}
.tag.pr{background:rgba(16, 185, 129, 0.2);color:var(--pr)}
.mu{color:var(--mu);font-size:14px}.err{color:var(--er);font-size:14px;min-height:20px;margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.back{background:none;border:0;color:var(--pr);padding:0 0 12px;font-weight:600;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
nav button{flex:1;padding:10px 2px;border:0;background:none;color:var(--mu);font-size:11px}nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px;margin-bottom:2px}
.num{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.vip-tag{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(16,185,129,0.2);color:var(--pr);font-weight:600}
.vip-icon{font-size:20px;margin-right:6px}
.manual-step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.manual-num{background:var(--pr);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0}
.product-badge{display:inline-block;background:rgba(139, 92, 246, 0.15);color:#a78bfa;font-size:11px;padding:3px 8px;border-radius:8px;margin-top:4px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
// 📌 CONSTANTES & PARAMÈTRES
const WAVE_NUM = "0509302107";
const MOOV_NUM = "0104217547";
const MTN_NUM  = "0545576710";
const JEKO_LINK = "https://pay.jeko.africa/pl/4f580acc-5df9-440e-b168-6beb65823bea"; 
const SUPPORT  = "https://wa.me/message/ABZ2BRFJPVIOE1";
const BONUS_PREMIUM = 350000;
const INVITATION_CODE = "WTZH";
const REFERRAL_BONUS = 300;
const APP_LINK = window.location.href.split("?")[0];

// 📊 11 PLANS D'INVESTISSEMENT (AVEC PLAN 1 ET PLAN 2 AJOUTÉS)
const VIP=[
  {n:"Plan 1 — Offre Spéciale", product:"Pack Croissance Rapide 15J", icon:"🌟", p:2500, jourRevenu:150, benefice:2250, total:4750, duree:15},
  {n:"Plan 2 — Offre Longue Durée", product:"Pack Rendement Durable 50J", icon:"💎", p:2300, jourRevenu:120, benefice:6000, total:8300, duree:50},
  {n:"VIP1 — Sac Découverte", product:"Sac à main de luxe Cuir Souple", icon:"🛍️", p:5000, jourRevenu:500, benefice:3500, total:8500, duree:7},
  {n:"VIP2 — Sac Essentiel", product:"Sac à dos urbain Imperméable", icon:"🎒", p:10000, jourRevenu:1000, benefice:15000, total:25000, duree:15},
  {n:"VIP3 — Sac Croissance", product:"Sacoche d'ordinateur Professionnelle", icon:"💼", p:50000, jourRevenu:1130, benefice:22600, total:72600, duree:20},
  {n:"VIP4 — Sac Premium", product:"Grand sac de voyage Weekend Rigide", icon:"👜", p:100000, jourRevenu:2000, benefice:60000, total:160000, duree:30},
  {n:"VIP5 — Sac Excellence", product:"Valise trolley cabine Aluminium", icon:"🧳", p:200000, jourRevenu:3000, benefice:250000, total:450000, duree:45},
  {n:"VIP6 — Sac Prestige", product:"Sac bandoulière de créateur Haute Couture", icon:"👛", p:500000, jourRevenu:2250, benefice:135000, total:635000, duree:60},
  {n:"VIP7 — Sac Élite", product:"Coffret exclusif Collection Maroquinerie Royale", icon:"👑", p:1000000, jourRevenu:5000, benefice:450000, total:1450000, duree:90},
  {n:"VIP8 — Sac Mini", product:"Mini pochette de soirée Élégante", icon:"⚡", p:4000, jourRevenu:343, benefice:4116, total:8116, duree:12},
  {n:"VIP9 — Sac Starter", product:"Sac banane sportif Multifonction", icon:"🚀", p:3500, jourRevenu:250, benefice:5750, total:9250, duree:23}
];

let P = "signup", T = {};

// GESTION DU STOCKAGE LOCAL (LocalStorage)
function getStorage(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let currentUser = getStorage("ac_user", null);
let recs = getStorage("ac_recs", []);
let rets = getStorage("ac_rets", []);
let buys = getStorage("ac_buys", []);
let teamN = getStorage("ac_team", 0);

// 🔗 RÉCUPÉRATION DU CODE DE PARRAINAGE DANS L'URL
const urlParams = new URLSearchParams(window.location.search);
const urlRef = urlParams.get("ref") || INVITATION_CODE;

// 🕒 VÉRIFICATION DE LA RÉCLAMATION QUOTIDIENNE
function canClaimToday() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const lastClaim = getStorage("ac_last_claim", "");
  return lastClaim !== todayStr && buys.some(b => (b.joursRestants === undefined ? b.duree : b.joursRestants) > 0);
}

// 🎁 FONCTION DE RÉCLAMATION MANUELLE DES REVENUS QUOTIDIENS
window.claimDailyRevenues = function() {
  if (!currentUser) return;
  const todayStr = new Date().toISOString().slice(0, 10);
  const lastClaim = getStorage("ac_last_claim", "");

  if (lastClaim === todayStr) {
    alert("⚠️ Vous avez déjà réclamé vos revenus aujourd'hui. Revenez demain matin !");
    return;
  }

  if (buys.length === 0) {
    alert("❌ Vous n'avez aucun sac de produit actif pour réclamer des revenus.");
    return;
  }

  let addedTotal = 0;
  let activeCount = 0;

  buys.forEach(b => {
    if (b.joursRestants === undefined) b.joursRestants = b.duree;
    
    if (b.joursRestants > 0) {
      currentUser.bal += b.jourRevenu;
      addedTotal += b.jourRevenu;
      b.joursRestants--;
      if (b.joursRestants === 0) b.status = "Terminé";
      activeCount++;
    }
  });

  if (addedTotal > 0) {
    setStorage("ac_user", currentUser);
    setStorage("ac_buys", buys);
    setStorage("ac_last_claim", todayStr);
    
    alert(`🎉 Félicitations !\n+${F(addedTotal)} ont été ajoutés à votre solde pour vos ${activeCount} sac(s) de produits actif(s).`);
    render();
  } else {
    alert("⚠️ Tous vos sacs de produits sont arrivés à terme.");
  }
};

// 🤝 PARTAGE DU LIEN DE PARRAINAGE & CRÉDIT AUTOMATIQUE DE 300 F
window.shareReferralLink = function() {
  if (!currentUser) return;
  const refCode = currentUser.myCode || INVITATION_CODE;
  const refLink = `${APP_LINK}?ref=${encodeURIComponent(refCode)}`;

  const creditReferral = () => {
    currentUser.bal = (currentUser.bal || 0) + REFERRAL_BONUS;
    teamN = (teamN || 0) + 1;
    setStorage("ac_user", currentUser);
    setStorage("ac_team", teamN);
    alert(`🎉 Lien de parrainage partagé !\n+${F(REFERRAL_BONUS)} ont été crédités automatiquement sur votre compte.`);
    render();
  };

  if (navigator.share) {
    navigator.share({
      title: "Avenir Capital",
      text: `Rejoins Avenir Capital avec mon code d'invitation ${refCode} :`,
      url: refLink
    }).then(() => {
      creditReferral();
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(refLink).then(() => {
      creditReferral();
    }).catch(() => {
      creditReferral();
    });
  }
};

const U = () => currentUser || { name: "Investisseur", phone: "", bal: 0, ref: INVITATION_CODE, myCode: INVITATION_CODE, card: null };
const F = n => Number(n||0).toLocaleString("fr-FR") + " F";
const D = () => new Date().toLocaleDateString("fr-FR");
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id)?.value?.trim() || "";

function go(p, t){ P = p; if(t) Object.assign(T, t); render(); scrollTo(0,0); }
function err(m){ const e = document.getElementById("err"); if(e) e.textContent = m; }

const back = (p="home") => `<button class="back" onclick="go('${p}')">‹ Retour</button>`;
const hist = (a, empty) => a.length ? a.map(x => `<div class="card row"><div><b>${F(x.a)}</b><div class="mu">${x.m} · ${x.t}</div></div><span class="tag" style="background:rgba(245,158,11,0.2);color:var(--gold);">${x.s||"En attente"}</span></div>`).join("") : `<p class="mu">${empty}</p>`;

window.copyN = function(num){
  navigator.clipboard.writeText(num).then(() => alert("✅ Copié !")).catch(() => alert(num));
};

const pages = {
signup: () => `<h1>Avenir Capital</h1><p class="mu">Créez votre compte pour commencer à investir.</p>
<div class="card">
  <label>Nom complet</label><input id="n" placeholder="Ex: Jean Kouassi">
  <label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">
  <label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">
  <label>Code d'invitation</label><input id="rf" value="${esc(urlRef)}" placeholder="Entrez votre code d'invitation">
  <div id="err" class="err"></div>
  <button class="btn" onclick="signup()">S'inscrire</button>
</div>
<button class="btn sec" onclick="go('login')">J'ai déjà un compte</button>`,

login: () => `<h1>Avenir Capital</h1>
<div class="card">
  <label>Numéro de téléphone</label><input id="ph" type="tel" placeholder="Ex: 0708091011">
  <label>Mot de passe</label><input id="pw" type="password" placeholder="••••••••">
  <div id="err" class="err"></div>
  <button class="btn" onclick="login()">Se connecter</button>
</div>
<button class="btn sec" onclick="go('signup')">Créer un compte</button>`,

home: () => { 
  const u = U(); 
  const showClaimBtn = canClaimToday();
  return `
<h2>Bonjour ${esc(u.name)} 👋</h2>
<div class="hero">
  <small>Solde disponible</small>
  <b>${F(u.bal)}</b>
</div>

${showClaimBtn ? `
<button class="btn gold" style="margin-bottom:14px;font-size:16px;padding:15px;" onclick="claimDailyRevenues()">
  🎁 Réclamer mes revenus du jour
</button>` : `
<div class="card" style="text-align:center;background:rgba(16,185,129,0.05);border-color:var(--pr);margin-bottom:14px;">
  <p style="margin:0;color:var(--pr);font-size:14px">✅ Revenus du jour déjà réclamés ou aucun plan actif.</p>
</div>`}

<a class="banner-pret" href="${SUPPORT}" target="_blank" rel="noopener">
  <span style="font-size:28px">💰</span>
  <h3 style="margin:6px 0 2px">Obtenir un Prêt Rapide</h3>
  <p style="margin:0;opacity:0.9;font-size:13px">Jusqu'à ${F(BONUS_PREMIUM)} — Écrivez-nous sur WhatsApp</p>
</a>

<div class="grid">
  <button onclick="go('recharge')"><span>➕</span>Recharger</button>
  <button onclick="go('withdraw')"><span>💸</span>Retirer</button>
  <button onclick="go('invest')"><span>📈</span>Investir</button>
  <button onclick="go('manual')"><span>📖</span>Guide / Manuel</button>
</div>

<button class="li" onclick="go('histRec')">📊 Historique des recharges <span>›</span></button>
<button class="li" onclick="go('histRet')">📊 Historique des retraits <span>›</span></button>
<button class="li" onclick="go('service')">💬 Service client WhatsApp <span>›</span></button>`; 
},

invest: () => `<h2>📈 Sacs de Produits (${VIP.length} Plans)</h2>` + VIP.map((v,i) => `
<div class="card">
  <div class="row"><b><span class="vip-icon">${v.icon}</span>${v.n}</b><span class="vip-tag">${v.duree} jours</span></div>
  <div style="margin:6px 0">
    <span class="product-badge">📦 Produit : ${esc(v.product)}</span>
  </div>
  <p class="mu" style="margin:8px 0">
    💵 Prix du sac : <b>${F(v.p)}</b><br>
    📅 Durée du cycle : ${v.duree} jours<br>
    ✅ Revenu/jour : ${F(v.jourRevenu)}<br>
    🎯 Bénéfice total : +${F(v.benefice)}<br>
    💰 Gain total estimé : <b>${F(v.total)}</b>
  </p>
  <button class="btn" onclick="buy(${i})">Acheter ce sac</button>
</div>`).join("") + `<div id="err" class="err"></div>`,

achats: () => {
  const showClaimBtn = canClaimToday();
  return `<h2>Mes Sacs</h2>` + 
  (showClaimBtn ? `<button class="btn gold" style="margin-bottom:12px" onclick="claimDailyRevenues()">🎁 Réclamer mes revenus du jour</button>` : ``) +
  (buys.length ? buys.map(x => `
<div class="card">
  <div class="row"><b>${x.icon||'🛍️'} ${x.n}</b><span class="tag ${x.joursRestants === 0 ? '' : 'pr'}">${x.joursRestants === 0 ? 'Terminé' : 'Actif'}</span></div>
  <div style="margin:4px 0"><span class="product-badge">📦 ${esc(x.product)}</span></div>
  <div class="mu" style="margin-top:6px">
    Prix du sac : ${F(x.p)} · +${F(x.jourRevenu)}/jour<br>
    Jours restants : <b>${x.joursRestants !== undefined ? x.joursRestants : x.duree}</b> / ${x.duree} jours<br>
    Bénéfice total : +${F(x.benefice)} · Total : ${F(x.total)}<br>
    Acheté le ${x.t}
  </div>
</div>`).join("") : `<p class="mu">Aucun sac de produit acheté pour le moment.</p>`);
},

team: () => {
  const refCode = U().myCode || INVITATION_CODE;
  const refLink = `${APP_LINK}?ref=${encodeURIComponent(refCode)}`;
  return `<h2>Mon équipe</h2>
<div class="card">
  <p class="mu">Votre code d'invitation</p>
  <div class="num" style="margin-bottom:10px">${esc(refCode)}</div>
  <p class="mu">Votre lien de parrainage</p>
  <div class="num" style="font-size:13px;word-break:break-all;margin-bottom:12px">${esc(refLink)}</div>
  <p class="mu">Gain par parrainage : <b style="color:var(--pr)">+${F(REFERRAL_BONUS)}</b> crédités automatiquement</p>
  <p class="mu" style="margin-top:6px;margin-bottom:12px">Membres parrainés : <b>${teamN}</b></p>
  <button class="btn" onclick="shareReferralLink()">🔗 Partager le lien de parrainage</button>
</div>`;
},

account: () => { const u = U(); return `<h2>Mon compte</h2>
<div class="card"><b>${esc(u.name)}</b><div class="mu">${esc(u.phone)} · Solde : ${F(u.bal)}</div></div>
${[["histRec","Historique des recharges"],["histRet","Historique des retraits"],["achats","Mes sacs de produits"],["team","Équipe"],["manual","📖 Guide d'utilisation & Réclamation"],["link","Lier mon compte de retrait"],["card","Ma carte bancaire"],["service","Service client"]].map(x => `<button class="li" onclick="go('${x[0]}')">${x[1]} <span>›</span></button>`).join("")}
<button class="btn out" onclick="logout()">Se déconnecter</button>`; },

manual: () => `${back()}<h2>📖 Manuel d'utilisation & Réclamation</h2>
<div class="card">
  <h3 style="color:var(--pr);margin-bottom:8px">1. Comment recharger son compte ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Allez sur l'accueil et cliquez sur le bouton <b>Recharger</b>.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Entrez le montant souhaité (minimum 1 000 F) ou choisissez un montant rapide.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Sélectionnez votre moyen de paiement (Wave, MTN Money, Moov Money ou Jeko).</div></div>
  <div class="manual-step"><div class="manual-num">4</div><div class="mu">Effectuez le transfert vers le numéro indiqué, puis entrez votre numéro d'expéditeur et la référence de transaction pour soumettre. La demande sera enregistrée en attente de validation par l'administrateur.</div></div>
</div>

<div class="card">
  <h3 style="color:var(--pr);margin-bottom:8px">2. Comment acheter un Sac de produit ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Vérifiez que votre solde disponible (crédité après validation de votre recharge par l'admin) est suffisant.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Cliquez sur l'onglet <b>Investir</b> en bas de l'écran.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Choisissez le plan ou le sac VIP de votre choix (ex: Plan 1 à 2 500 F ou Plan 2 à 2 300 F) et cliquez sur <b>Acheter ce sac</b>.</div></div>
</div>

<div class="card" style="border-color:var(--gold)">
  <h3 style="color:var(--gold);margin-bottom:8px">3. Comment réclamer ses revenus chaque matin ?</h3>
  <div class="manual-step"><div class="manual-num">1</div><div class="mu">Connectez-vous à votre application <b>chaque matin</b>.</div></div>
  <div class="manual-step"><div class="manual-num">2</div><div class="mu">Sur la page <b>Accueil</b> ou dans l'onglet <b>Mes sacs</b>, un bouton doré apparaîtra : <b style="color:var(--gold)">"🎁 Réclamer mes revenus du jour"</b>.</div></div>
  <div class="manual-step"><div class="manual-num">3</div><div class="mu">Cliquez dessus pour ajouter instantanément vos gains journaliers de vos sacs de produits actifs à votre solde disponible !</div></div>
</div>`,

recharge: () => `${back()}<h2>Recharger</h2>
<div class="card">
  <label>Montant (minimum 1 000 F)</label>
  <input id="a" type="number" inputmode="numeric" value="${T.amt||""}" placeholder="Ex: 10000">
  <div class="chips">
    ${[2300, 2500, 5000, 10000, 50000, 100000].map(v => `<button onclick="document.getElementById('a').value=${v}">${v.toLocaleString("fr-FR")}</button>`).join("")}
  </div>
  <div id="err" class="err"></div>
  <button class="btn" onclick="toMethod()">Continuer</button>
</div>`,

method: () => `${back("recharge")}<h2>Choisir le mode de paiement</h2>
<p class="mu">Montant à recharger : <b>${F(T.amt)}</b></p>
<button class="li wave" onclick="go('pay', {m:'Wave', num:'${WAVE_NUM}'})"><b>Wave</b><span>›</span></button>
<button class="li" onclick="go('pay', {m:'MTN Money', num:'${MTN_NUM}'})"><b>MTN Money</b><span>›</span></button>
<button class="li" onclick="go('pay', {m:'Moov Money', num:'${MOOV_NUM}'})"><b>Moov Money</b><span>›</span></button>
<a class="btn jeko" style="display:block;margin-top:10px;text-align:center;text-decoration:none" href="${JEKO_LINK}" target="_blank">🔗 Veuillez payer pour Avenir avec Jeko</a>`,

pay: () => `${back("method")}<h2>Paiement par ${T.m}</h2>
<div class="card">
  <p class="mu">Veuillez effectuer le transfert de <b>${F(T.amt)}</b> vers le numéro ci-dessous :</p>
  <div class="card" style="background:var(--bg);text-align:center">
    <div class="row" style="align-items:center;justify-content:center;gap:12px;">
      <div class="num" style="margin:0">${T.num}</div>
    </div>
    <div class="row" style="align-items:center;justify-content:center;gap:8px;margin-top:10px;">
      <button class="btn sec btn-sm" style="width:auto;padding:8px 16px" onclick="copyN('${T.num}')">Copier le numéro</button>
      <a class="btn jeko" style="width:auto;padding:8px 14px;font-size:13px;text-decoration:none;" href="${JEKO_LINK}" target="_blank">🔗 Veuillez payer pour Avenir</a>
    </div>
  </div>
  <label>Votre numéro de paiement (expéditeur)</label><input id="pn" type="tel" placeholder="Ex: 0708091011">
  <label>ID de transaction / Référence</label><input id="tx" placeholder="Ex: Tx12345678">
  <div id="err" class="err"></div>
  <button class="btn" onclick="confirmPay()">Confirmer le paiement</button>
</div>`,

withdraw: () => { const c = U().card; return `${back()}<h2>Retirer des fonds</h2>
<div class="card">
  <p class="mu">Solde disponible : <b style="color:var(--pr)">${F(U().bal)}</b></p>
  <label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric" placeholder="Ex: 5000">
  <label>Votre numéro de réception</label><input id="pn" type="tel" value="${c ? esc(c.num) : esc(U().phone)}" placeholder="Ex: 0708091011">
  <label>Réseau</label>
  <select id="m">
    <option value="Wave">Wave</option>
    <option value="MTN Money">MTN Money</option>
    <option value="Moov Money">Moov Money</option>
  </select>
  <div id="err" class="err"></div>
  <button class="btn" onclick="confirmWithdraw()">Demander le retrait</button>
</div>`; },

link: () => `${back("account")}<h2>Lier mon compte de retrait</h2>
<div class="card">
  <label>Nom complet du titulaire</label><input id="cn" value="${esc(U().card?.holder||U().name)}" placeholder="Ex: Jean Kouassi">
  <label>Numéro de téléphone</label><input id="cp" type="tel" value="${esc(U().card?.num||U().phone)}" placeholder="Ex: 0708091011">
  <div id="err" class="err"></div>
  <button class="btn" onclick="saveLink()">Enregistrer</button>
</div>`,

card: () => `${back("account")}<h2>Ma carte bancaire</h2>
<div class="card">
  <label>Titulaire de la carte</label><input id="ch" value="${esc(U().card?.holder||"")}" placeholder="Ex: Jean Kouassi">
  <label>Numéro de carte / compte</label><input id="cn" value="${esc(U().card?.num||"")}" placeholder="•••• •••• ••••">
  <div id="err" class="err"></div>
  <button class="btn" onclick="saveCard()">Enregistrer la carte</button>
</div>`,

histRec: () => `${back()}<h2>Historique des recharges</h2>` + hist(recs, "Aucune recharge enregistrée."),
histRet: () => `${back()}<h2>Historique des retraits</h2>` + hist(rets, "Aucun retrait enregistré."),
service: () => `${back()}<h2>Service client</h2><div class="card"><p class="mu">Besoin d'aide ou d'un prêt rapide ? Contactez notre équipe directement sur WhatsApp.</p><a class="btn" href="${SUPPORT}" target="_blank" rel="noopener">Contacter sur WhatsApp</a></div>`
};

window.signup = function(){
  const name = $("n"), phone = $("ph"), pw = $("pw"), ref = $("rf") || INVITATION_CODE;
  if(!name || !phone || !pw) return err("Veuillez remplir tous les champs obligatoires.");
  const initialBal = ref ? REFERRAL_BONUS : 0;
  currentUser = { name, phone, pw, bal: initialBal, ref, myCode: INVITATION_CODE, card: null };
  setStorage("ac_user", currentUser);
  go("home");
};

window.login = function(){
  const phone = $("ph"), pw = $("pw");
  if(!phone || !pw) return err("Entrez votre numéro et votre mot de passe.");
  if(!currentUser){
    currentUser = { name: "Investisseur", phone, pw, bal: 0, ref: INVITATION_CODE, myCode: INVITATION_CODE, card: null };
    setStorage("ac_user", currentUser);
  }
  go("home");
};

window.logout = function(){
  currentUser = null;
  setStorage("ac_user", null);
  go("login");
};

window.toMethod = function(){
  const amt = Number($("a"));
  if(!amt || amt < 1000) return err("Le montant minimum est de 1 000 F.");
  T.amt = amt;
  go("method");
};

window.confirmPay = function(){
  const pn = $("pn"), tx = $("tx");
  if(!pn || !tx) return err("Veuillez saisir votre numéro et la référence de transaction.");
  recs.unshift({ a: T.amt, m: T.m, pn, tx, t: D(), s: "En attente" });
  setStorage("ac_recs", recs);
  alert("✅ Demande de recharge enregistrée en attente de validation.");
  go("histRec");
};

window.confirmWithdraw = function(){
  const amt = Number($("a")), pn = $("pn"), m = $("m");
  if(!amt || amt < 1000) return err("Le retrait minimum est de 1 000 F.");
  if(!pn) return err("Veuillez saisir votre numéro de réception.");
  if(amt > U().bal) return err("Solde insuffisant.");
  currentUser.bal -= amt;
  rets.unshift({ a: amt, m, pn, t: D(), s: "En attente" });
  setStorage("ac_user", currentUser);
  setStorage("ac_rets", rets);
  alert("✅ Demande de retrait enregistrée.");
  go("histRet");
};

window.saveLink = function(){
  const holder = $("cn"), num = $("cp");
  if(!holder || !num) return err("Veuillez remplir tous les champs.");
  if(!currentUser) currentUser = { name: holder, phone: num, bal: 0, ref: INVITATION_CODE, myCode: INVITATION_CODE, card: null };
  currentUser.card = { holder, num };
  setStorage("ac_user", currentUser);
  alert("✅ Compte de retrait enregistré.");
  go("account");
};

window.saveCard = function(){
  const holder = $("ch"), num = $("cn");
  if(!holder || !num) return err("Veuillez remplir tous les champs.");
  if(!currentUser) currentUser = { name: holder, phone: "", bal: 0, ref: INVITATION_CODE, myCode: INVITATION_CODE, card: null };
  currentUser.card = { holder, num };
  setStorage("ac_user", currentUser);
  alert("✅ Carte enregistrée.");
  go("account");
};

window.buy = function(i){
  const v = VIP[i];
  if(!v) return;
  if(!currentUser) currentUser = { name: "Investisseur", phone: "", bal: 0, ref: INVITATION_CODE, myCode: INVITATION_CODE, card: null };
  if(currentUser.bal < v.p) return err(`Solde insuffisant (${F(currentUser.bal)}). Veuillez recharger votre compte.`);
  currentUser.bal -= v.p;
  buys.unshift({ ...v, joursRestants: v.duree, t: D(), status: "Actif" });
  setStorage("ac_user", currentUser);
  setStorage("ac_buys", buys);
  alert(`🎉 Vous avez acheté ${v.n} (${v.product}) !`);
  go("achats");
};

const tabs = [
  ["home", "🏠", "Accueil"],
  ["invest", "📈", "Investir"],
  ["achats", "🛍️", "Mes sacs"],
  ["team", "👥", "Équipe"],
  ["account", "👤", "Compte"]
];

function render(){
  const authPages = ["signup", "login"];
  if(!currentUser && !authPages.includes(P)) P = "signup";
  document.getElementById("app").innerHTML = (pages[P] || pages.home)();
  const nav = document.getElementById("nav");
  if(authPages.includes(P)){
    nav.style.display = "none";
  } else {
    nav.style.display = "flex";
    nav.innerHTML = tabs.map(([k, ic, lb]) => `<button class="${P===k?'on':''}" onclick="go('${k}')"><span>${ic}</span>${lb}</button>`).join("");
  }
}

render();
</script>
</body>
</html>
